[Bridge]
AutoLaunch=1

[Debug]
InstallCameraHook=1
DumpFirstFrame=0

[Render]
CacheBridgeFrames=1
EdgeSmoothing=1
ForceGame1080p=1
GameWidth=2560
GameHeight=1440

[Camera]
HideHead=1
ForceFirstPerson=1
RotationTracking=1
PositionTracking=1
WorldUnitsPerMeter=50.0
RotationScale=1.0
PitchSign=1.0
YawSign=1.0
RollSign=1.0
StabilizeGamePitchRoll=1
RecenterOnTrackingResume=0
BodyFollowHMD=1
BodyFollowMaxStepUnits=40.0
BodyFollowMinMoveUnits=0.50
BodyFollowMaxLeanUnits=6.0

[Stereo]
Mode=2
IPDMeters=0.064
SwapEyes=0
InstallCaptureHook=1
CaptureEnabled=1
; v0.7: do not stretch the 16:9 desktop image into each eye.
; Advent Rising renders a wide FOV; each eye receives the OpenXR-matched crop.
OpenXRCrop=1
CaptureViewportOnly=0
; The D3DTS_PROJECTION matrix observed in this build is the 2D/UI path, not the 3D camera.
LegacyProjectionHook=0

[Menu]
; Menus use a flat panel when the game camera reports a non-gameplay scene.
DistanceMeters=2.0
WidthMeters=2.2
VerticalOffsetMeters=0.0

[Input]
TurnDegreesPerSecond=90
VRTargetFocus=1
PocketGrenade=1
GestureMelee=1
MeleeSpeed=0.9
MeleeDistance=0.06
EnableQuestControllers=1
StickDeadzone=0.25
TurnMousePixelsPerSecond=900.0
RightStickVertical=0

[Hands]
Enable=1
UpperArmLength=21.77
ForeArmLength=21.73
ShoulderForward=0.0
ShoulderSide=16.0
ShoulderDown=-17.0
ElbowDownBias=-0.55
HandForwardOffset=0.0
HandSideOffset=0.0
HandVerticalOffset=-3.0
RightHandPitchOffset=0
RightHandYawOffset=0
RightHandRollOffset=0
LeftHandPitchOffset=0
LeftHandYawOffset=0
LeftHandRollOffset=0

[HUD]
Enable=1
DistanceMeters=1.5
WidthMeters=0.65
VerticalOffsetMeters=-0.50
